  </text>

  <!-- Feature pills -->
  <g transform="translate(320, 390)">
    <rect width="170" height="48" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="85" y="30" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#34d399" text-anchor="middle">⚡ Gerçek Zamanlı</text>
  </g>

  <g transform="translate(520, 390)">
