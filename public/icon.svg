<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.4" />

  <!-- Diagonal Glow Line -->
  <line x1="60" y1="452" x2="452" y2="60" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- Overlapping Cards -->
  <!-- Back Card -->
  <rect x="135" y="110" width="190" height="280" rx="20" fill="#1e293b" stroke="#334155" stroke-width="6" transform="rotate(-15 230 250)" />
  <!-- Front Card with Glow -->
  <rect x="185" y="120" width="190" height="280" rx="20" fill="url(#cardGrad)" stroke="#34d399" stroke-width="6" transform="rotate(10 280 260)" filter="url(#neonGlow)" />

  <!-- Central Letter 'P' -->
  <text x="275" y="295" font-family="'Orbitron', 'Inter', sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle" transform="rotate(10 280 260)">P</text>

  <!-- Sparkles -->
  <circle cx="120" cy="140" r="8" fill="#fbbf24" />
  <circle cx="390" cy="380" r="10" fill="#10b981" />
  <polygon points="380,130 388,145 405,148 392,160 395,178 380,168 365,178 368,160 355,148 372,145" fill="#38bdf8" />
</svg>
