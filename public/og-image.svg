    <text x="80" y="30" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#38bdf8" text-anchor="middle">🎮 RENQ / UNO</text>
  </g>

  <g transform="translate(710, 390)">
    <rect width="170" height="48" rx="24" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="85" y="30" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#c084fc" text-anchor="middle">🤖 Akıllı Yapay Zeka</text>
  </g>

  <!-- URL footer -->
  <text x="600" y="550" font-family="'Inter', sans-serif" font-weight="500" font-size="20" fill="#64748b" text-anchor="middle">
