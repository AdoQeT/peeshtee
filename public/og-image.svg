<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#091e23" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)" />

  <circle cx="600" cy="315" r="320" fill="#10b981" opacity="0.08" />
  <circle cx="950" cy="180" r="180" fill="#06b6d4" opacity="0.06" />

  <!-- Title & Subtitle -->
  <text x="600" y="240" font-family="'Orbitron', sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    PİŞTİ: <tspan fill="url(#accent)">OVERDRIVE</tspan>
  </text>

  <text x="600" y="320" font-family="'Inter', sans-serif" font-weight="600" font-size="28" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
